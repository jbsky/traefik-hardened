# security-audit -- audit hebdomadaire de l'image publiee (gabarit hardened-ci).
name: security-audit

on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: jbsky/hardened-ci/.github/workflows/security-audit.yml@88bfa0599e83e6b25934715df2e4a370994b89d6 # v1.4.2
    permissions:
      contents: read
      packages: read
      security-events: write
      issues: write
