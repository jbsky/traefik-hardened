# security-audit -- audit hebdomadaire de l'image publiee (gabarit hardened-ci).
name: security-audit

on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: jbsky/hardened-ci/.github/workflows/security-audit.yml@8c22d396d42e663d887de0aca16a5fad4e8659f8 # v1.3.1
    permissions:
      contents: read
      packages: read
      security-events: write
      issues: write
