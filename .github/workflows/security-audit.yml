# security-audit -- audit hebdomadaire de l'image publiee (gabarit hardened-ci).
name: security-audit

on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: jbsky/hardened-ci/.github/workflows/security-audit.yml@c0be9ec717d12aa6776ec79ab9e29c4c1979a59b # v1.4.3
    permissions:
      contents: read
      packages: read
      security-events: write
      issues: write
