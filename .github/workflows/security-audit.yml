# security-audit -- audit hebdomadaire de l'image publiee (gabarit hardened-ci).
name: security-audit

on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: jbsky/hardened-ci/.github/workflows/security-audit.yml@6ace661b63b5fc0f82bbf930037851c64e5af9e8 # v1.4.7
    permissions:
      contents: read
      packages: read
      security-events: write
      issues: write
