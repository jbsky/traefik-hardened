# security-audit -- audit hebdomadaire de l'image publiee (gabarit hardened-ci).
name: security-audit

on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: jbsky/hardened-ci/.github/workflows/security-audit.yml@f30ccc2bae3bb682031ccbfcef54287fbfbc5f9d # v1.4.6
    permissions:
      contents: read
      packages: read
      security-events: write
      issues: write
