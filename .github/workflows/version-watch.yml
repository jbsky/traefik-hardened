# =====================================================================
#  Version Watch -- Traefik Hardened
#  Quotidien : monte versions.json vers la derniere version amont et
#  republie -- plus de main humaine (garde-fou retire sur demande explicite,
#  les sauvegardes couvrent le risque residuel).
#
#  Meme chaine que base-watch, qui l'a eprouvee : bump -> commit -> push ->
#  dispatch de build-push. Un push fait avec GITHUB_TOKEN ne declenche aucun
#  `on: push` (garde anti-recursion de GitHub), d'ou le dispatch explicite.
#
#  Le sha256 de l'archive source est recalcule dans le MEME commit que la
#  version : jamais une valeur devinee ou recopiee.
# =====================================================================
name: version-watch

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Relever l'ecart et s'arreter la (ni commit, ni push, ni publication)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Monter vers la derniere version amont
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Comparer et monter si besoin
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current=$(jq -r '.traefik' versions.json)
          # Les 100 dernieres releases suffisent : l'amont en publie ~2 par
          # mois. La plus haute de toutes (patch ou mineure confondus) est
          # la cible -- une mineure ne s'attend plus a une lecture humaine
          # des notes de version.
          tags=$(gh api "repos/traefik/traefik/releases?per_page=100" --jq '.[] | select(.prerelease == false) | .tag_name')
          test -n "$tags" || { echo "::error::aucune release lue sur traefik/traefik"; exit 1; }
          cible=$(printf '%s\n' "$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 | sed 's/^v//')
          {
            echo "- versions.json : ${current}"
            echo "- derniere version amont : ${cible}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${cible}" = "${current}" ]; then
            echo "a_jour=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "a_jour=false" >> "$GITHUB_OUTPUT"
          echo "cible=${cible}" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "--dry-run : ${current} -> ${cible}, rien ecrit."
            exit 0
          fi

          tarball="${RUNNER_TEMP}/traefik.tar.gz"
          curl -fsSL "https://github.com/traefik/traefik/releases/download/v${cible}/traefik-v${cible}.src.tar.gz" -o "$tarball"
          sha256=$(sha256sum "$tarball" | cut -d' ' -f1)

          jq --arg v "$cible" --arg h "$sha256" '.traefik = $v | .traefik_sha256 = $h' versions.json > "${RUNNER_TEMP}/versions.json"
          mv "${RUNNER_TEMP}/versions.json" versions.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "build(traefik): ${current} -> ${cible}" \
            -m "Montee automatique (version-watch). sha256 de traefik-v${cible}.src.tar.gz recalcule dans ce commit."
          pousse=false
          for essai in 1 2 3; do
            if git push; then pousse=true; break; fi
            echo "push refuse (essai ${essai}) -- rebase sur l'origine"
            git pull --rebase --autostash
          done
          if [ "$pousse" != true ]; then
            echo "::error::push impossible apres 3 essais"
            exit 1
          fi
          gh workflow run build-push.yml --ref main -R "$GITHUB_REPOSITORY"

      # Un seul chemin pour les deux cas : la veille ferme l'issue si elle
      # vient de monter (ou si l'ecart a disparu sans elle), et n'en ouvre
      # plus jamais une qui demanderait une action humaine deja faite.
      - name: Fermer l'issue de veille si elle est encore ouverte
        if: steps.bump.outputs.a_jour == 'true' || steps.bump.outputs.cible != ''
        uses: actions/github-script@v9
        env:
          A_JOUR: ${{ steps.bump.outputs.a_jour }}
          CIBLE: ${{ steps.bump.outputs.cible }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            if (process.env.DRY_RUN === 'true') return;
            const title = '[Veille] Version amont de Traefik disponible';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 50,
            });
            const existing = open.data.find(i => i.title === title);
            if (!existing) return;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = process.env.A_JOUR === 'true'
              ? `versions.json est a jour : plus aucun ecart avec l'amont.\n\n[Execution](${run})`
              : `Montee automatique vers ${process.env.CIBLE} declenchee : ${run}`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed' });
